# Fortify on Demand SAST scan using a Subscription entitlement (static scans)
# Save in the repo as .github/workflows/fortify.yml
#
# Uses the action's built-in setup (fcli setup-release), which creates the FoD application
# and release if missing and configures static scan settings on a Subscription entitlement.
#
# Flow: push to main scans release <org>/<repo>:main.
#       A pull request into main scans release <org>/<repo>:<pr-branch>, created by copying
#       state (audit decisions, suppressions) from the main release.
#
# Aviator: enabled in the static scan settings (DO_AVIATOR_AUDIT).
# GitHub SARIF: results are published to GitHub code scanning (Security tab) with the
#               workflow's GITHUB_TOKEN; needs code scanning enabled on the repo.
#
# Required repository secrets:   FOD_TENANT, FOD_USER, FOD_PAT
# Required repository variable:  FOD_URL (e.g. https://apac.fortify.com)

name: Fortify Security Scan

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: fortify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Fortify-SAST:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - name: Check out source code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'                       # builds the project's Java 8 source/target

      - name: Run Fortify on Demand SAST scan
        uses: fortify/github-action@v3
        env:
          FOD_URL: ${{ vars.FOD_URL }}             # repository variable, not a secret
          FOD_TENANT: ${{ secrets.FOD_TENANT }}
          FOD_USER: ${{ secrets.FOD_USER }}
          FOD_PASSWORD: ${{ secrets.FOD_PAT }}
          # Release defaults to <org>/<repo>:<branch>
          # PR releases copy state from the target branch release (blank on push, so ignored)
          COPY_FROM_RELEASE: ${{ github.event_name == 'pull_request' && format('{0}:{1}', github.repository, github.base_ref) || '' }}
          DO_AVIATOR_AUDIT: true
          # Packaging is per repo. No compile step; Maven/Gradle only resolve dependencies.
          #   Maven:            -bt mvn -bf pom.xml
          #   Gradle:           -bt gradle
          #   No build tool (JS/TS, Python, IaC, scripts): -bt none
          PACKAGE_EXTRA_OPTS: "-bt mvn -bf pom.xml"
          DO_CHECK_POLICY: true
          DO_PR_COMMENT: ${{ github.event_name == 'pull_request' }}   # preview feature
          DO_SAST_EXPORT: true                     # publish SAST results to GitHub code scanning
          SAST_EXPORT_EXTRA_OPTS: "--type sarif"   # SARIF only; fail instead of falling back to a Check Run
          FCLI_BOOTSTRAP_VERSION: v3.28